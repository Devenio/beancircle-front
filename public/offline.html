<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>You're offline · Bean Circle</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --card: #f6f4f2;
        --accent: #c87f43;
        --accent-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #fafafa;
          --muted: #a3a3a3;
          --card: #1a1614;
          --accent: #d68a4c;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      main { max-width: 360px; width: 100%; }
      .mark {
        width: 88px; height: 88px; margin: 0 auto 28px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 24px;
        background: linear-gradient(135deg, #2a1a12, #140b07);
        box-shadow: 0 18px 40px -16px rgba(200, 127, 67, 0.5);
      }
      .mark svg { width: 52px; height: 52px; }
      h1 { font-size: 22px; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.01em; }
      p { font-size: 15px; line-height: 1.6; color: var(--muted); margin: 0 0 28px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: var(--accent); color: var(--accent-fg);
        font-size: 15px; font-weight: 600; font-family: inherit;
        padding: 13px 22px; border-radius: 14px; width: 100%;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }
      button:active { transform: translateY(1px); opacity: 0.9; }
      button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
      .status { margin-top: 18px; font-size: 13px; color: var(--muted); min-height: 18px; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e0533a; margin-inline-end: 6px; vertical-align: middle; }
      .dot.online { background: #2fae5f; }
    </style>
  </head>
  <body>
    <main role="main">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f5b878" />
              <stop offset="55%" stop-color="#c87f43" />
              <stop offset="100%" stop-color="#7a4a25" />
            </linearGradient>
          </defs>
          <ellipse cx="48" cy="48" rx="20" ry="27" fill="url(#r)" transform="rotate(32 48 48)" />
          <path d="M48 24 C40 36, 56 60, 48 72" fill="none" stroke="#160d08" stroke-width="4" stroke-linecap="round" transform="rotate(32 48 48)" />
        </svg>
      </div>
      <h1 id="title">You're offline</h1>
      <p id="message">Bean Circle needs an internet connection for this page. Check your connection and try again — your cached pages still work.</p>
      <button id="retry" type="button">Try again</button>
      <p class="status" id="status" aria-live="polite"><span class="dot" id="dot"></span><span id="statusText">No connection</span></p>
    </main>

    <script>
      (function () {
        // Lightweight locale swap so the fallback matches the app's two locales.
        var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
        var t = {
          en: {
            title: "You're offline",
            message:
              'Bean Circle needs an internet connection for this page. Check your connection and try again — your cached pages still work.',
            retry: 'Try again',
            offline: 'No connection',
            online: 'Back online — reconnecting…',
          },
          fa: {
            title: 'اتصال اینترنت قطع است',
            message:
              'برای این صفحه به اینترنت نیاز است. اتصال خود را بررسی کنید و دوباره تلاش کنید — صفحات ذخیره‌شده همچنان کار می‌کنند.',
            retry: 'تلاش دوباره',
            offline: 'بدون اتصال',
            online: 'دوباره آنلاین شدید — در حال اتصال…',
          },
        };
        var L = t[lang] || t.en;
        if (lang === 'fa') {
          document.documentElement.lang = 'fa';
          document.documentElement.dir = 'rtl';
        }
        document.getElementById('title').textContent = L.title;
        document.getElementById('message').textContent = L.message;
        document.getElementById('retry').textContent = L.retry;
        document.getElementById('statusText').textContent = navigator.onLine ? L.online : L.offline;

        function reload() {
          location.reload();
        }
        document.getElementById('retry').addEventListener('click', reload);

        function setStatus() {
          var online = navigator.onLine;
          document.getElementById('dot').className = 'dot' + (online ? ' online' : '');
          document.getElementById('statusText').textContent = online ? L.online : L.offline;
          if (online) setTimeout(reload, 600);
        }
        window.addEventListener('online', setStatus);
        window.addEventListener('offline', setStatus);
      })();
    </script>
  </body>
</html>
